# Runs `npm run check` (typecheck and tests) on Node 26 for every pull request and every push to main.
# A second job, `docker`, builds the Dockerfile (no push, no registry login) and smoke-tests the image.
# When this workflow passes for a pull request from Symphony's agents, automerge.yml decides whether to merge it.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run for the previous commit.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: symphony:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: --help runs without secrets
        run: docker run --rm symphony:ci --help
      - name: --version runs without secrets
        run: docker run --rm symphony:ci --version
      - name: Tools are installed
        run: docker run --rm --entrypoint bash symphony:ci -lc 'php -v && php -m | grep -qi pdo_sqlite && composer --version && git --version'
      - name: Entrypoint exits with 2 without required variables
        run: |
          code=0
          docker run --rm symphony:ci || code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected exit code 2, got $code" >&2
            exit 1
          fi
